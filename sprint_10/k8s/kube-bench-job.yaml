apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: security-tools
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: kube-bench
    spec:
      restartPolicy: Never
      hostPID: true

      containers:
        - name: kube-bench
          image: aquasec/kube-bench:latest
          imagePullPolicy: IfNotPresent

          command:
            - kube-bench

          args:
            - run
            - --targets
            - master,node

          securityContext:
            privileged: true
            allowPrivilegeEscalation: true

          volumeMounts:
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true

            - name: var-lib-etcd
              mountPath: /var/lib/etcd
              readOnly: true

            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true

            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true

            - name: usr-bin
              mountPath: /usr/local/mount-from-host/bin
              readOnly: true

      volumes:
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
            type: Directory

        - name: var-lib-etcd
          hostPath:
            path: /var/lib/etcd
            type: Directory

        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory

        - name: etc-systemd
          hostPath:
            path: /etc/systemd
            type: Directory

        - name: usr-bin
          hostPath:
            path: /usr/bin
            type: Directory
